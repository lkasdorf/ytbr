#
# Release workflow for YTBR.
#
# Trigger: a tag matching `v*.*.*` pushed to the repo (e.g. `v0.3.0`).
# Output: a draft GitHub Release named `YTBR <tag>` with platform
#         installers attached:
#           - Windows: .msi (Wix) + .exe (NSIS)
#           - Linux:   .deb + .rpm + .AppImage
#         plus a `.sig` per installer and `latest.json` for the in-app
#         updater.
# The user reviews the draft and clicks Publish manually.
#
# Pre-flight (run locally before tagging):
#
#   pnpm version:set 0.3.0          # bumps the three manifests
#   # ...edit CHANGELOG: move [Unreleased] entries under [0.3.0] - DATE...
#   git commit -am "chore(release): v0.3.0"
#   git tag -a v0.3.0 -m "v0.3.0"
#   git push origin main v0.3.0     # the tag push fires this workflow
#
# Concurrency is keyed by tag, not branch — two simultaneous tag pushes
# would race for the same release, which is what we want to prevent.

name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Refuse to build if `pnpm version:set` was forgotten — releasing
      # a tag whose three manifests disagree means the sidebar shows a
      # different version than the installer filename.
      - name: Assert tag matches package version
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            echo "did you forget to run 'pnpm version:set $tag' before tagging?" >&2
            exit 1
          fi
          echo "tag/pkg match: $pkg"
          pnpm version:check

      - name: Fetch sidecar binaries (yt-dlp + LGPL ffmpeg, UPX-compressed)
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-binaries.sh ${{ matrix.target }}

      - name: Fetch sidecar binaries (yt-dlp + LGPL ffmpeg, UPX-compressed)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-binaries.ps1 -Target ${{ matrix.target }}

      # tauri-action runs `pnpm tauri build`, then walks the
      # src-tauri/target/release/bundle/ output and uploads every
      # installer it finds to the release identified by tagName.
      # First runner that lands creates the draft release; subsequent
      # runners attach to the same release.
      # tauri-action signs the bundles when TAURI_SIGNING_PRIVATE_KEY is
      # set in the env, generates `latest.json` with the signatures and
      # download URLs, and uploads it to the release alongside the
      # installers. The shipped `tauri-plugin-updater` looks for that
      # `latest.json` at the URL configured in tauri.conf.json's
      # `plugins.updater.endpoints` (latest/download/latest.json).
      #
      # Behavior since tauri-action v1 (it was v0.6.x up to YTBR v1.5.2):
      #   - The download URLs inside `latest.json` point at the GitHub
      #     API (`api.github.com/repos/<owner>/<repo>/releases/assets/<id>`)
      #     instead of `github.com/.../releases/download/<tag>/<file>`.
      #     tauri-plugin-updater downloads with
      #     `Accept: application/octet-stream`, which the API answers
      #     with a redirect to the file, so updates keep working. The
      #     API allows 60 anonymous requests per hour and IP address; a
      #     user behind a shared address can see an update download
      #     fail and succeed on a later try.
      #   - Every build job rewrites the name and body of the existing
      #     draft with `releaseName` / `releaseBody` below. Hand-written
      #     release notes go into the draft only after BOTH jobs have
      #     finished, or the slower job overwrites them.
      #   - The action fails when `releaseDraft: true` meets a release
      #     that is no longer a draft. Re-running this workflow for a
      #     tag whose release is already published does not work.
      #
      # Both env vars come from GitHub repo secrets — see CLAUDE.md for
      # the keypair-generation steps. If they're empty the build still
      # works but no signatures land in latest.json, and the in-app
      # updater silently falls back to the GitHub-API path.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YTBR ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the entry corresponding to ${{ github.ref_name }}.

            Installers: `.msi` / `.exe` (Windows), `.deb` / `.rpm` / `.AppImage` (Linux).

            Each YTBR installer bundles `yt-dlp` (Unlicense) and a UPX-compressed LGPL build of `ffmpeg`. Per LGPL Section 6 the `ffmpeg` sidecar inside the install directory may be replaced by the end user with a compatible build.
          releaseDraft: true
          prerelease: false
