#
# CI for YTBR — runs on every push to main and on every PR.
#
# What it covers per OS (Windows + Ubuntu):
#   - frontend: ESLint (no warnings allowed) + Vitest unit tests +
#               TypeScript strict + Vite production build
#   - backend:  cargo clippy (warnings are errors) + cargo test --lib
#   - sidecars: yt-dlp + LGPL ffmpeg fetched via the same scripts
#               developers run locally (so we exercise the full pipeline,
#               UPX compression included)
# Repo-wide once:
#   - cargo-deny licenses (Linux only — the license set is platform-agnostic)
#   - pnpm version:check (asserts the three manifests stay in lockstep)
#
# Notes:
#   - We do not run `pnpm tauri build` here (full installer takes ~10-15 min
#     per OS). That belongs to a separate release workflow when the time
#     comes; this lane is the fast-feedback gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      # The webkit2gtk-4.1 + libxdo set is what tauri-action lists as the
      # Linux 2.x build prerequisite — see tauri.app docs.
      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Fetch sidecar binaries (yt-dlp + LGPL ffmpeg, UPX-compressed)
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-binaries.sh ${{ matrix.target }}

      - name: Fetch sidecar binaries (yt-dlp + LGPL ffmpeg, UPX-compressed)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-binaries.ps1 -Target ${{ matrix.target }}

      - name: Frontend lint (ESLint, no warnings allowed)
        run: pnpm lint

      - name: Frontend unit tests (Vitest)
        run: pnpm test

      - name: Frontend build (TypeScript strict + Vite)
        run: pnpm build

      # Clippy runs the same compiler passes as `cargo check`, so it
      # replaces that step rather than adding to it.
      - name: Cargo clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Cargo unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

  licenses:
    name: License gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install (lockfile-only — no postinstall scripts needed)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Version sync (package.json / Cargo.toml / tauri.conf.json)
        run: pnpm version:check

      - name: cargo-deny check licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses
